<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMARTZ Desk — Syndicate Trading Room</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b0e14; --card:#12161f; --line:#1e2532; --txt:#e8ecf4; --dim:#8b94a7; --up:#3ddc97; --dn:#ff5c6c; --acc:#f0b90b; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:14px; }
  .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .hd h1 { font-size:18px; letter-spacing:1px; }
  .hd h1 b { color:var(--acc); }
  .live { font-size:10px; color:var(--up); border:1px solid var(--up); border-radius:20px; padding:2px 8px; }
  .eng { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:11px; color:var(--dim); }
  .chip b { color:var(--txt); }
  .chip.gold b { color:var(--acc); }
  .tape { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .tok { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .tok .sym { font-size:12px; color:var(--dim); letter-spacing:1px; }
  .tok .px { font-size:17px; font-weight:700; margin:2px 0; }
  .tok .ch { font-size:12px; font-weight:600; }
  .up { color:var(--up); } .dn { color:var(--dn); }
  .sec { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .sec h2 { font-size:12px; color:var(--dim); letter-spacing:1.5px; margin-bottom:8px; text-transform:uppercase; }
  .call { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
  .call:last-child { border-bottom:none; }
  .call .dir { font-weight:700; }
  .call .meta { color:var(--dim); font-size:11px; }
  .none { color:var(--dim); font-size:13px; }
  #ad-slot { margin-bottom:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:6px 0; text-align:center; }
  #ad-slot .lbl { font-size:9px; color:var(--dim); letter-spacing:1.5px; padding:2px 0 4px; }
  #ad-slot iframe { display:block; margin:0 auto; border:0; width:100%; max-width:440px; height:110px; }
  #toast { display:none; background:var(--card); border:1px solid var(--acc); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.5; margin-bottom:12px; white-space:pre-line; }
  .cta { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { flex:1; min-width:30%; text-align:center; text-decoration:none; font-weight:700; font-size:14px; padding:13px 0; border-radius:12px; border:none; cursor:pointer; }
  .btn.pri { background:var(--acc); color:#000; }
  .btn.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .btn.ghost { flex-basis:100%; background:transparent; color:var(--dim); font-size:11px; font-weight:600; padding:6px 0; }
  .foot { text-align:center; color:var(--dim); font-size:10px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>SMARTZ<b>DESK</b></h1><span class="live">● LIVE</span></div>
  <div class="eng" id="eng"><span class="chip">Open inside Telegram for check-ins</span></div>
  <div class="tape" id="tape"><div class="tok"><span class="none">Loading tape…</span></div></div>
  <div class="sec"><h2>Open Calls</h2><div id="calls"><div class="none">Loading…</div></div></div>
  <div id="ad-slot">
    <div class="lbl">SPONSORED — VIEWS FUND THE MEMBER REWARD POOL</div>
    <iframe data-aa="2455269" src="https://acceptable.a-ads.com/2455269/?size=Adaptive"></iframe>
  </div>
  <div id="toast"></div>
  <div class="cta">
    <button class="btn pri" id="ckin">📅 CHECK-IN</button>
    <a class="btn sec" id="join" href="https://t.me/Smrtquickflips">Join the Floor</a>
    <a class="btn sec" id="os" href="https://smc.kimi.page">Open SmartzOS</a>
    <button class="btn ghost" id="why">how the reward pool works</button>
  </div>
  <div class="foot">Smartz Syndicate · engagement pays · DYOR · v3.0</div>
</div>

<script>
const BRIDGE = 'https://dezhsrzymylqpzdtymij.supabase.co/functions/v1/tg-bridge';
const tg = window.Telegram && window.Telegram.WebApp;
const initData = (tg && tg.initData) || '';
if (tg) { tg.ready(); tg.expand(); if (tg.MainButton) { tg.MainButton.setText('JOIN THE FLOOR'); tg.MainButton.onClick(() => tg.openTelegramLink('https://t.me/Smrtquickflips')); tg.MainButton.show(); } }
const buzz = (ok) => { try { tg && tg.HapticFeedback && (ok ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch(e){} };
const strip = (h) => String(h || '').replace(/<[^>]+>/g, '');
let busy = false;

function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.borderColor = ok === false ? 'var(--dn)' : 'var(--acc)';
  buzz(ok !== false);
}

async function engCall(action) {
  if (!initData) { toast('Open this desk inside Telegram (bot menu → 🚀 Desk) — your check-in identity lives there.', false); return null; }
  const r = await fetch(BRIDGE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, initData }), signal: AbortSignal.timeout(12000) });
  return r.json().catch(() => null);
}

async function refreshEng() {
  const el = document.getElementById('eng');
  if (!initData) return;
  try {
    const j = await engCall('eng_status');
    if (!j || !j.ok) return;
    el.innerHTML =
      `<span class="chip gold">🔥 streak <b>${j.streak}d</b></span>` +
      `<span class="chip">📅 check-ins <b>${j.checkins}</b>${j.chest ? ' 🏆' : ''}</span>` +
      (j.boost_pct > 0 ? `<span class="chip gold">⚡ boost <b>+${j.boost_pct}%</b></span>` : `<span class="chip">⚡ boost <b>+0%</b></span>`) +
      `<span class="chip">👥 qualified refs <b>${j.qualified_refs}</b></span>` +
      (j.gate ? `<span class="chip gold">🚪 GATE CLEARED</span>` : '');
  } catch (e) { /* keep last */ }
}

document.getElementById('ckin').addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  document.getElementById('ckin').textContent = '…';
  try {
    const j = await engCall('checkin');
    if (!j) return;
    toast(strip(j.dm) || (j.ok ? 'Checked in.' : 'Not yet — ' + (j.error || 'try again.')));
    if (j.ok) refreshEng();
  } catch (e) { toast('Desk unreachable — try again in a moment.', false); }
  finally { busy = false; document.getElementById('ckin').textContent = '📅 CHECK-IN'; }
});

document.getElementById('why').addEventListener('click', () => {
  toast('The banner above pays the Syndicate treasury per view/click. The treasury funds daily check-ins, scout visits and referral boosts — paid in SMC dust to members. Check in daily: streaks multiply your pay up to 3x, and day 30 opens the Vesting Chest. Invitees who check in 3x qualify and add +7% to everything you earn (max +35%).');
});
document.getElementById('join').addEventListener('click', () => buzz(true));
document.getElementById('os').addEventListener('click', () => buzz(true));

const fmt = (p) => { p = Number(p); if (!isFinite(p)) return '—'; return p >= 1 ? p.toFixed(4) : p.toPrecision(3); };
async function loadTape() {
  try {
    const r = await fetch(BRIDGE + '?action=tape_data', { signal: AbortSignal.timeout(6000) });
    const j = await r.json();
    const t = j.tokens || {};
    const el = document.getElementById('tape');
    el.innerHTML = Object.entries(t).map(([sym, d]) => {
      const ch = Number(d.chg24 || 0);
      return `<div class="tok"><div class="sym">${sym}</div>` +
        `<div class="px">$${fmt(d.price)}</div>` +
        `<div class="ch ${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(1)}% 24h · $${(Number(d.liq) || 0).toFixed(0)} liq</div></div>`;
    }).join('') || '<div class="none">Tape offline — try again soon.</div>';
  } catch (e) { /* keep last render */ }
}
async function loadCalls() {
  try {
    const r = await fetch(BRIDGE + '?action=calls_data', { signal: AbortSignal.timeout(6000) });
    const j = await r.json();
    const open = (j.open || j.calls || []).slice(0, 6);
    document.getElementById('calls').innerHTML = open.length
      ? open.map(c => `<div class="call"><span><span class="dir ${String(c.dir).toUpperCase() === 'UP' ? 'up' : 'dn'}">${String(c.dir).toUpperCase()}</span> ${c.sym || c.token || ''}</span><span class="meta">@${c.by || c.user || 'floor'} · ${c.ago || ''}</span></div>`).join('')
      : '<div class="none">No open calls — the floor decides the next one. Calls live in the group.</div>';
  } catch (e) { /* keep */ }
}
loadTape(); loadCalls(); refreshEng();
setInterval(loadTape, 30000);
setInterval(loadCalls, 60000);
</script>
</body>
</html>
